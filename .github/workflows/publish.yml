name: Build and publish images

# Publishes multi-arch (amd64 + arm64) images to GHCR on every release tag.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Each release pushes THREE tags per image so Watchtower on the NAS (which
# watches the fixed `:latest` tag) picks up the new digest automatically:
#   - pixelpaladin-backend:1.2.0   (exact version)
#   - pixelpaladin-backend:1.2     (major.minor, moving)
#   - pixelpaladin-backend:latest  (moving — what the NAS/Watchtower tracks)
#
# Uses the built-in GITHUB_TOKEN — no secrets to configure.

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # UB-17: gate image publish on score/progress unit tests.
  # Runs existing node harness; also exercises shared/ when present (W2).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run score / lifetime unit tests
        run: node backend/scripts/test-score-order.js

      - name: Run shared module smoke (if present)
        run: |
          if [ -f shared/index.js ]; then
            node -e "
              const s = require('./shared');
              const assert = require('assert');
              assert.equal(typeof s.calculateProgress, 'function');
              assert.equal(typeof s.calculateTaskPoints, 'function');
              assert.equal(typeof s.getTierFromProgress, 'function');
              // Negative lifetime floor (UB-10 shape)
              const apply = (score, delta) => Math.max(0, score + delta);
              assert.equal(apply(10, -15), 0);
              assert.equal(s.getTierFromProgress(0), 'Bronze');
              console.log('shared smoke OK', Object.keys(s).sort().join(','));
            "
          else
            echo 'shared/ not present yet — skipping shared smoke'
          fi

      - name: Run any extra shared/node test scripts
        run: |
          set -e
          found=0
          for f in backend/scripts/test-shared*.js shared/test*.js; do
            if [ -f "$f" ]; then
              found=1
              echo "Running $f"
              node "$f"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo 'No extra shared test scripts found — OK'
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dockerfiles COPY shared/ from repo root — context must be `.`
          #   docker build -f backend/Dockerfile .
          #   docker build -f frontend/Dockerfile .
          - service: backend
            context: .
            file: backend/Dockerfile
            image: pixelpaladin-backend
          - service: frontend
            context: .
            file: frontend/Dockerfile
            image: pixelpaladin-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image paths must be lowercase; the owner login may contain capitals.
      - name: Compute lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
