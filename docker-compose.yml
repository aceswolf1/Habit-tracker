# PixelPaladin — full stack for self-hosting (TrueNAS / any Docker host)
#
#   frontend (Nuxt/Nitro) ── proxies /api/cycles ──▶ backend (Express) ──▶ mongo
#
# Only the frontend port is published; backend + mongo stay on the internal
# network. Copy .env.example to .env and adjust APP_PORT / credentials first.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pixelpaladin}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/your-name}/pixelpaladin-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      # Defaults to the bundled mongo service. Override to point at MongoDB Atlas.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/pixelpaladin}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/your-name}/pixelpaladin-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # Internal address of the backend service (used by the Nitro reverse proxy)
      BACKEND_URL: http://backend:4000
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo-data:
    driver: local
