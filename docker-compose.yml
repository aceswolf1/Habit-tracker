# PixelPaladin — full stack for self-hosting (TrueNAS / any Docker host)
#
#   frontend (Nuxt/Nitro) ── proxies /api/cycles|/api/tasks ──▶ backend (Express) ──▶ mongo
#                         └── /api/klipy/* (Nitro; needs KLIPY_API_KEY in .env)
#
# Only the frontend port is published; backend + mongo stay on the internal
# network. Copy .env.example to .env and adjust APP_PORT / KLIPY_API_KEY first.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pixelpaladin}
    volumes:
      - mongo-data:/data/db
    # UB-33: cap RSS so mongo can't starve the NAS during heavy writes / index builds.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/your-name}/pixelpaladin-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      # Defaults to the bundled mongo service. Override to point at MongoDB Atlas.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/pixelpaladin}
      # UB-58: per-deployment user-profile uuid. Override in .env for
      # multi-tenant / multi-family setups; defaults keep the original
      # single-user behaviour.
      USER_PROFILE_UUID: ${USER_PROFILE_UUID:-default-user}
    # UB-33: Express API is small + single-user; 256m leaves headroom for V8 bursts.
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # UB-16: probe /readyz (mongoose connected) via node http — no wget dependency
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/your-name}/pixelpaladin-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # Internal address of the backend service (used by the Nitro reverse proxy)
      BACKEND_URL: http://backend:4000
      # GIF search/trending (Nitro /api/klipy/*). Set in root `.env` — never bake into the image.
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      KLIPY_BASE_URL: ${KLIPY_BASE_URL:-https://api.klipy.com}
    ports:
      - "${APP_PORT:-3001}:3000"
    # UB-33: Nitro node server + Nuxt SSR cache. Single-user LAN client load;
    # 384m is the largest of the three because Nuxt's SSR rendering + emoji/asset buffers.
    mem_limit: 384m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # UB-16: Nitro /api/health (lightweight; backend gated by depends_on healthy)
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
    driver: local
