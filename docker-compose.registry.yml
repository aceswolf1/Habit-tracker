services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pixelpaladin
    volumes:
      - /mnt/storage/pixelpaladin/mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/aceswolf1/pixelpaladin-backend:latest
    restart: unless-stopped
    # Let Watchtower auto-update this service when a new :latest is published.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/pixelpaladin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/aceswolf1/pixelpaladin-frontend:latest
    restart: unless-stopped
    # Let Watchtower auto-update this service when a new :latest is published.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      BACKEND_URL: http://backend:4000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_started
