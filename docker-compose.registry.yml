services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pixelpaladin
    volumes:
      - /mnt/storage/pixelpaladin/mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/aceswolf1/pixelpaladin-backend:latest
    restart: unless-stopped
    # Let Watchtower auto-update this service when a new :latest is published.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/pixelpaladin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # UB-16: probe /readyz (mongoose connected) via node http — no wget dependency
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/aceswolf1/pixelpaladin-frontend:latest
    restart: unless-stopped
    # Let Watchtower auto-update this service when a new :latest is published.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      BACKEND_URL: http://backend:4000
      # GIF search/trending (Nitro /api/klipy/*). Plain docker compose: set in `.env` next to
      # this file. TrueNAS Custom App: no .env — paste the key here in the app YAML only
      # (never commit it). See deploy/AUTOMATION.md "TrueNAS Custom Apps don't read .env".
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      KLIPY_BASE_URL: ${KLIPY_BASE_URL:-https://api.klipy.com}
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # UB-16: Nitro /api/health (lightweight; backend gated by depends_on healthy)
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
